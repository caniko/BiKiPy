ingress_method: animal
ingress:
  stageful_metadata: true
  skip_absent_trials_absent_from_metadata_index: true
  meters_per_pixel_definition_strategy: metadata
  perimeter_definition_strategy: trial-wise
  center_definition_strategy: metadata
perimeter:
  label_prefix: object
  label_suffix: null
  perimeter_names_in_metadata: false
  perimeter_mapper_key: label
  fields:
    defined:
      label: null
      outdated:
        impenetrable: true
    required:
      label: string
      outdated:
        video: None
    optional:
      group_label: string
      impenetrable: boolean -> False
      inspect: boolean -> False
      inspect_directory: string
      int_id: integer
      manual_fps: number
      manual_frame: '[{''type'': ''np.ndarray''}, {''type'': ''string'', ''format'':
        ''file-path''}]'
      manual_recording_resolution: np.ndarray[name='manual_recording_resolution_0'
        type=short required=True]
      manual_video: '[{''$ref'': ''#/definitions/VideoMetadata''}]'
      meters_per_pixel: np.ndarray[name='meters_per_pixel_0' type=dobble required=True]
      reference_point_array: np.ndarray[name='reference_point_array_0' type=short
        required=True]
      reference_point_coco_path: string
      video_path: string
      outdated:
        inspect_image_array: np.ndarray[name='inspect_image_array_0' type=dobble required=True]
        inspect_image_path: string
        label: string
        timestamp: string
        outdated:
          save_root: string
reader_kwargs:
  defined:
    crop_from_end: false
    midpoint_groups:
      center_eye:
      - left_ear
      - right_ear
  optional:
    crop_from_end: boolean -> False
    crop_time_seconds: number -> 0.0
    future_scaling: boolean
    manual_fps: number
    manual_frame: '[{''type'': ''np.ndarray''}, {''type'': ''string'', ''format'':
      ''file-path''}]'
    manual_recording_resolution: np.ndarray[name='manual_recording_resolution_0' type=short
      required=True]
    manual_video: '[{''$ref'': ''#/definitions/VideoMetadata''}]'
    meters_per_pixel: np.ndarray[name='meters_per_pixel_0' type=dobble required=True]
    midpoint_groups: object
    min_likelihood: number -> 0.8
    reverse_y_axis: boolean -> True
    timestamp_index: array
    video_path: string
    x_axis_crop_end_point: number -> 0.0
    y_axis_crop_end_point: number -> 0.0
trial:
  common:
    defined:
      animal_id: null
      coordinate_data_path: null
      label: null
      object_1: null
      object_tracking_label_for_kinematics: center_eye
      reader_kwargs: null
      physical_object_inspect: true
      gaze_start_point_label: center_eye
      gaze_travel_direction_point_label: nose
      perimeter_border_normal_meters: 0.05
    required:
      animal_id: '[{''type'': ''string''}, {''type'': ''integer''}]'
      coordinate_data_path: string
      label: string
      object_1: None
      object_tracking_label_for_kinematics: string
      reader_kwargs: object
    optional:
      center_box_to_spatial_resolution_ratio: number
      crop_from_end: boolean -> True
      crop_time_seconds: number -> 0.0
      data_format_label: string -> deeplabcut
      gaze_start_point_label: string
      gaze_travel_direction_point_label: string
      inspect: boolean -> False
      inspect_directory: string
      inspect_image: np.ndarray
      inspect_quadrants: boolean -> False
      manual_center_pixels: np.ndarray[name='manual_center_pixels_0' type=short required=True]
      manual_fps: number
      manual_frame: '[{''type'': ''np.ndarray''}, {''type'': ''string'', ''format'':
        ''file-path''}]'
      manual_recording_resolution: np.ndarray[name='manual_recording_resolution_0'
        type=short required=True]
      manual_video: '[{''$ref'': ''#/definitions/VideoMetadata''}]'
      maximum_radians_inter_gaze_perimeter: number -> 1.0471975511965976
      maximum_seconds_distraction: number -> 0.6666666666666666
      meters_per_pixel: np.ndarray[name='meters_per_pixel_0' type=dobble required=True]
      minimum_seconds_attention: number -> 0.3333333333333333
      perimeter_border_normal_meters: number
      physical_object_inspect: boolean -> False
      rectangle_2d_bin: array -> (2, 2)
      rigid_nodes_freezing: array
      stage: string
      trial_start_perimeter: string
      video_path: string
  specific:
    ObjectsInUpdatingLocationsTrainingTrial:
      defined:
        object_2: null
        crop_time_seconds: 900
      required:
        object_2: None
    ObjectsInUpdatingLocationsUpdateTrial:
      defined:
        object_4: null
        crop_time_seconds: 300
      required:
        object_4: None
    ObjectsInUpdatingLocationsTestTrial:
      defined:
        object_2: null
        object_3: null
        object_4: null
        crop_time_seconds: 300
      required:
        object_2: None
        object_3: None
        object_4: None
experiment:
  defined: {}
  optional:
    common_trial_keyword_arguments: object
    compute_only_one_df_row: boolean -> False
    data_format_label: string -> deeplabcut
    inspect: boolean -> False
    inspect_directory: string
    inspect_image_path: string
    label: string
    manual_fps: number
    manual_frame: '[{''type'': ''np.ndarray''}, {''type'': ''string'', ''format'':
      ''file-path''}]'
    manual_recording_resolution: np.ndarray[name='manual_recording_resolution_0' type=short
      required=True]
    manual_trial_ids: array
    manual_video: '[{''$ref'': ''#/definitions/VideoMetadata''}]'
    meters_per_pixel: np.ndarray[name='meters_per_pixel_0' type=dobble required=True]
    stage: string
    trial_class_name_to_keyword_arguments: object
    trial_id_range_to_keyword_arguments: RangedDict
    trial_id_to_keyword_arguments: object
    trial_id_to_trial_class_name: object
    video_path: string
immutable:
  metadata_filename: metadata.xlsx
  kinematic_data_file_extension: .parquet
  experiment_class: ObjectsInUpdatingLocationsExperiment
  stage_index_to_trial_class_name:
    0: ObjectsInUpdatingLocationsTrainingTrial
    1: ObjectsInUpdatingLocationsUpdateTrial
    2: ObjectsInUpdatingLocationsTestTrial
