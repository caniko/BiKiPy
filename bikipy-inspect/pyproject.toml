[project]
name = "bikipy-inspect"
version = "0.1.0"
license = { text = "GPL-3.0-or-later" }
description = "Matplotlib-based inspection and visualization for bikipy analysis output"
authors = [{ name = "Can H. Tartanoglu", email = "canhtart@gmail.com" }]
requires-python = ">=3.12,<3.14"

dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "matplotlib>=3.8",
    "seaborn",
    "moviepy>=1.0.3",
    "opencv-python>=4.9",
    "click>=8.1",
]

[project.scripts]
bkpy-inspect = "bikipy_inspect.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
