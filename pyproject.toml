[tool.poetry]
name = "BiKiPy"
version = "0.0.1"
license = "GPL-3.0-or-later"
description = "Liberary for automatic analysis of kinematic data"
authors = ["Can H. Tartanoglu <canhtart@gmail.com>"]
readme = "README.md"
packages = [{include = "bikipy"}]

[tool.poetry.dependencies]
python = ">=3.10.0, <3.11"
click = "^8.1.3"
pydantic = "^1.8.2"
pydantic-numpy = {git = "https://github.com/caniko/pydantic-numpy.git"}

numpy = "^1.21.6"
scipy = "^1.8.0"
scikit-guess = {git = "https://github.com/madphysicist/scikit-guess"}

pandas = "^1.4.1"
tables = "*"

pyarrow = "*"
h5py = "*"
openpyxl = "*"
odfpy = "*"

numba = "*"

matplotlib = "^3.2.2"
seaborn = "*"
ffmpeg-python = "^0.2.0"
opencv-python-headless = "^4.5"

colorama = { "version" = "^0.4.4", "platform" = "win32" }
tqdm = "^4.60.0"

compress-pickle = {extras = ["lz4"], version = "^2.0.1"}
PyYAML = "^6.0"
plyer = "^2.0.0"

statsmodels = {version = "^0.13.1", optional = true }

pyzmq = {version = "^22.2.1", optional = true }
jupyter = { version = "^1.0.0", optional = true }
jupyterthemes = { version = "^0.20.0", optional = true }
scikit-posthocs = {version = "^0.6.7", optional = true}

[tool.poetry.scripts]
bkpy = "bikipy.cli.ingress:cli_root"

[tool.poetry.dev-dependencies]
black = {version = "*", extras = ["jupyter"]}
Cython = "*"
isort = "*"
pytest = "*"

Sphinx = "*"
sphinx-material = "*"
sphinx-autoapi = "*"
setuptools = "*"

[tool.poetry.extras]
stats = ["statsmodels"]
live = ["pyzmq"]
jupyter = ["jupyter", "jupyterthemes"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ["py310"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
