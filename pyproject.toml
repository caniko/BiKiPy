[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.poetry]
name = "bikipy"
version = "1.0.0"
license = "LGPL-3.0-or-later"
description = "Liberary for automatic analysis of kinematic data"
authors = ["Can H. Tartanoglu <canhtart@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.9.0,<3.10"

numpy = "^1.19.3"
scipy = "^1.5.3"
opencv-python = "^4.2.0"

pandas = "^1.0.5"
openpyxl = "^3.0.5"
odfpy = "^1.4.1"
tables = "^3.6.1"

matplotlib = "^3.2.2"
seaborn = "^0.11.1"

colorama = {"version" = "^0.4.4", "platform" = "win32"}
tqdm = "^4.60.0"

jupyter = { version = "^1.0.0", optional = true }
llvmlite = "^0.36.0"
pyarrow = "^4.0.0"
fletcher = "^0.7.2"

[tool.poetry.dev-dependencies]
black = {extras = ["d"], version = "^20.8b1"}
pytest = "^5.4.3"
commitizen = "^1.23.0"
pre-commit = "^2.5.1"
isort = "^5.6.4"

[tool.poetry.extras]
jupyter = ["jupyter"]

[tool.isort]
profile = "black"

[tool.black]
target-version = ['py37']
include = '\.pyi?$'
exclude = '''
(
 /(
     \.eggs         # exclude a few common directories in the
   | \.git          # root of the project
   | \.hg
   | \.mypy_cache
   | \.tox
   | \.venv
   | _build
   | buck-out
   | build
   | dist
   | docs
 )/
)
'''
