[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.poetry]
name = "bikipy"
version = "0.0.1"
license = "LGPL-3.0-or-later"
description = "Liberary for automatic analysis of kinematic data"
authors = ["Can H. Tartanoglu <canhtart@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.8.0, <3.10"
llvmlite = "^0.36.0"

numpy = "^1.19.3"
scipy = "^1.5.3"
opencv-python = "^4.2.0"
Shapely = "^1.7.1"
numba = "^0.53.1"

pandas = "^1.0.5"
tables = "^3.6.1"
pyarrow = "^4.0.0"
openpyxl = "^3.0.5"
odfpy = "^1.4.1"

matplotlib = "^3.2.2"
seaborn = "^0.11.1"

colorama = {"version" = "^0.4.4", "platform" = "win32"}
tqdm = "^4.60.0"

compress-pickle = {extras = ["lz4"], version = "^2.0.1"}

jupyter = { version = "^1.0.0", optional = true }
jupyterthemes = { version = "^0.20.0", optional = true }
statsmodels = "^0.12.2"
h5py = "^3.3.0"

[tool.poetry.dev-dependencies]
black = {extras = ["d"], version = "*"}
isort = "*"
pylint = "*"
pytest = "^5.4.3"
commitizen = "^1.23.0"
pre-commit = "^2.5.1"
Sphinx = "^4.0.2"
sphinx-material = "^0.0.32"
sphinx-autoapi = "^1.8.1"

[tool.poetry.extras]
jupyter = ["jupyter", "jupyterthemes"]

[tool.isort]
profile = "black"

[tool.black]
target-version = ['py37', 'py38', 'py39']
include = '\.pyi?$'
exclude = '''
(
 /(
     \.eggs         # exclude a few common directories in the
   | \.git          # root of the project
   | \.hg
   | \.mypy_cache
   | \.tox
   | \.venv
   | _build
   | buck-out
   | build
   | dist
   | docs
 )/
)
'''
