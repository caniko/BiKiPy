[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.poetry]
name = "bikipy"
version = "0.0.1"
license = "LGPL-3.0-or-later"
description = "Liberary for automatic analysis of kinematic data"
authors = ["Can H. Tartanoglu <canhtart@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.9.0, <3.10"
pydantic = "^1.8.2"

numpy = "^1.19.3"
scipy = "^1.5.3"
Shapely = "^1.7.1"

pandas = "^1.0.5"
tables = "*"

pyarrow = "*"
h5py = "*"
openpyxl = "*"
odfpy = "*"

llvmlite = "*"
numba = "^0.53.1"

matplotlib = "^3.2.2"
PyQt5 = { version = "*", platform = "linux" }
seaborn = "*"
ffmpeg-python = "^0.2.0"
opencv-python-headless = "^4.5"

colorama = {"version" = "^0.4.4", "platform" = "win32"}
tqdm = "^4.60.0"

compress-pickle = {extras = ["lz4"], version = "^2.0.1"}

statsmodels = {version = "^0.13.1", optional = true }
pyzmq = {version = "^22.2.1", optional = true }
jupyter = { version = "^1.0.0", optional = true }
jupyterthemes = { version = "^0.20.0", optional = true }
scikit-guess = {git = "https://github.com/madphysicist/scikit-guess"}

[tool.poetry.dev-dependencies]
black = "*"
Cython = "*"
isort = "*"
pytest = "^6.2.5"

Sphinx = {version = "*", optional = true }
sphinx-material = {version = "*", optional = true }
sphinx-autoapi = {version = "*", optional = true }
setuptools = {version = "*", optional = true }

[tool.poetry.extras]
stats = ["statsmodels"]
live = ["pyzmq"]

jupyter = ["jupyter", "jupyterthemes"]

sphinx = ["Sphinx", "sphinx-material", "sphinx-autoapi", "setuptools"]

[tool.isort]
profile = "black"

[tool.black]
target-version = ['py37', 'py38', 'py39']
include = '\.pyi?$'
exclude = '''
(
 /(
     \.eggs         # exclude a few common directories in the
   | \.git          # root of the project
   | \.hg
   | \.mypy_cache
   | \.tox
   | \.venv
   | _build
   | buck-out
   | build
   | dist
   | docs
 )/
)
'''
