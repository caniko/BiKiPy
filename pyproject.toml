[tool.poetry]
name = "BiKiPy"
version = "0.0.1"
license = "GPL-3.0-or-later"
description = "Liberary for automatic analysis of kinematic data"
authors = ["Can H. Tartanoglu <canhtart@gmail.com>"]

readme = "README.md"
packages = [{include = "bikipy"}]

[tool.poetry.dependencies]
python = ">=3.10.0, <3.11"
setuptools = "*"

click = "^8.1.3"
pydantic = "^1.8.2"
pydantic-numpy = "^1.2.1"

numpy = "^1.21.6"
scipy = "^1.8.0"
scikit-guess = {git = "https://github.com/madphysicist/scikit-guess"}

pandas = "^1.4.1"
tables = "*"

pyarrow = "*"
h5py = "*"
openpyxl = "*"
odfpy = "*"

numba = "*"

matplotlib = "^3.2.2"
seaborn = "*"
PySide6 = "*"

ffmpeg-python = "^0.2.0"
opencv-python-headless = "^4.5"

colorama = { "version" = "^0.4.4", "platform" = "win32" }
tqdm = "^4.60.0"

compress-pickle = {extras = ["lz4"], version = "^2.0.1"}
PyYAML = "^6.0"

statsmodels = {version = "^0.13.1", optional = true }

pyzmq = {version = "^22.2.1", optional = true }
jupyter = { version = "^1.0.0", optional = true }
jupyterthemes = { version = "^0.20.0", optional = true }
yaspin = "^2.1.0"

[tool.poetry.dev-dependencies]
pytest = "^7.1.2"

Sphinx = "*"
sphinx-material = "*"
sphinx-autoapi = "*"

[tool.poetry.extras]
stats = ["statsmodels"]
live = ["pyzmq"]
jupyter = ["jupyter", "jupyterthemes"]

[tool.poetry.scripts]
bkpy = "bikipy.cli:cli_root"

[tool.mypy]
python_version = "3.10"
plugins = "numpy.typing.mypy_plugin"

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ["py310"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
