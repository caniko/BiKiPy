[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.poetry]
name = "bikipy"
version = "0.3.0"
license = "LGPL-3.0-or-later"
description = "Liberary for automatic analysis of kinematic data"
authors = ["Can H. Tartanoglu <canhtart@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.6.1,<4.0.0"
numpy = "1.19.3"
pandas = "^1.0.5"
tables = "^3.6.1"
matplotlib = "^3.2.2"
numba = "^0.51.2"
jupyter = "^1.0.0"
openpyxl = "^3.0.5"
scipy = "^1.5.3"
odfpy = "^1.4.1"
pywin32 = {version = "228", platform = "win32"}
opencv-python = { version = "4.2.0.34", optional = true }

[tool.poetry.extras]
opencv = ["opencv-python"]

[tool.poetry.dev-dependencies]
black = {extras = ["d"], version = "^20.8b1"}
pytest = "^5.4.3"
commitizen = "^1.23.0"
pre-commit = "^2.5.1"
opencv-python = "4.2.0.34"
isort = "^5.6.4"

[tool.isort]
profile = "black"

[tool.black]
target-version = ['py37']
include = '\.pyi?$'
exclude = '''
(
 /(
     \.eggs         # exclude a few common directories in the
   | \.git          # root of the project
   | \.hg
   | \.mypy_cache
   | \.tox
   | \.venv
   | _build
   | buck-out
   | build
   | dist
   | docs
 )/
)
'''
