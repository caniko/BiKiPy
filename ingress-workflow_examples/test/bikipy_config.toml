manual_reference = "np.ndarray[name='manual_reference_0' type=float required=True]"
manual_shape = "string"
manual_trial_argument_key = "string"
manual_trial_ids = "array"
manual_video = "All[[{'$ref': '#/definitions/VideoMetadata'}]]"
matplotlib_invert_y_axis = "boolean(default: False)"
matplotlib_scatter_alpha = "number(default: 0.6)"
maximum_seconds_distraction = "number(default: 0.6666666666666666)"
