fps = "number"
frame = "Any[string, array]"
ignore_pre_existing_inspection_directory = "boolean(default: False)"
impenetrable = "boolean(default: False)"
ingress_defined_perimeters = "object(default: {})"
inspect_arg = "Any[string, boolean](default: False)"
inspect_image_path = "string"
label_prefix = "string"
label_suffix = "string"
length_meters_of_meters_per_pixel_source = "number"
manual_center_pixels = "np.ndarray[name='manual_center_pixels_0' type=int required=True]"
manual_center_rectangle_dimensions_meters = "np.ndarray[name='manual_center_rectangle_dimensions_meters_0' type=float required=True]"
manual_enclosure = "All[[{'$ref': '#/definitions/BasePerimeter'}]]"
