meters_per_pixel_from_perimeter_source = "string"
minimum_frame_length = "integer(default: 600)"
minimum_seconds_tolerance = "number(default: 0.2)"
moving_field_name = "string"
only_physical_cores = "boolean(default: False)"
physical_object_inspect = "boolean(default: False)"
plural_entries = "boolean(default: True)"
project_directory = "string"
reader_class_label = "string(default: DeepLabCutReader)"
recording_resolution = "np.ndarray[name='recording_resolution_0' type=int required=True]"
rectangle_2d_bin = "array(default: (2, 2))"
rigid_nodes_freezing = "array"
skip_habituation = "boolean(default: False)"
