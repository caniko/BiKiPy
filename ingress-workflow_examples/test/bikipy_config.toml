data_path = "string"
dataset_directory = "string"
debug = "boolean(default: False)"
definition_center = "array"
definition_change_reference = "array"
definition_enclosure = "array"
definition_frame = "array"
definition_meters_per_pixel = "array"
definition_radial = "array"
definition_single_perimeter = "array"
definition_timestamp = "array"
definition_video = "array"
deprecated_project_settings_file_name = "boolean(default: False)"
derive_meters_per_pixel = "boolean(default: False)"
derived_meters_per_pixel_source = "string"
derived_meters_per_pixel_source_metric_length = "number"
