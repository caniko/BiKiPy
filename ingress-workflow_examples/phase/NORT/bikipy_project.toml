[immutable]
metadata_filename = "metadata.xlsx"
experiment_class = "nort"
trial_sequence = ["NortTrainingTrial", "NortNoveltyTrial"]

[developer]
activate_debugging = false

[developer.settings]
disable_numba = false
disable_process_pooling = false
only_physical_cores = false

[ingress]
method = "phase"
first_stage_is_habituation = true
metadata_trial_ids_are_higher_level = false
trial_sequence_loops = 1
framewise_coordinates_file_suffix = ".parquet"
dataset_directory = "/home/can/Downloads/Compressed/nort/"
profile_runtime = true

[definition_strategies]
meters_per_pixel = "global"
perimeter = "metadata"
enclosure = ""
radial = ""
change_reference = "metadata"
frame = ""
video = "trial-wise"
timestamp = ""
center = ""

[manual_reader_kwargs]
[manual_reader_kwargs.defined.midpoint_groups]
center_eye = ["left_ear", "right_ear"]
torso = ["center_eye", "tail"]


[manual_reader_kwargs.optional]
cache_meters_augmented = "boolean -> True"
crop_from_end = "boolean -> False"
crop_time_seconds = "number -> 0.0"
df_is_timestamped = "boolean -> False"
df_read_kwargs = "object"
export_timestamp_data_as_parquet = "boolean -> False"
filter_displacement_by_std = "number -> 2.0"
filter_kwargs = "object"
