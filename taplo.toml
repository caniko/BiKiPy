# Example configs are generated fixtures, not formatter-owned source.
# Sorts `Cargo.toml` dependencies. Other source `.toml` files use the default config.
#
# https://taplo.tamasfe.dev/configuration/file.html#configuration-file

exclude = ["examples/**"]

[formatting]
reorder_keys = false

[[rule]]
include = ["**/Cargo.toml"]
keys = ["dependencies"]

[rule.formatting]
reorder_keys = true
