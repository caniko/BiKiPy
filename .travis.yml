language: python
os: linux
python:
- '3.6.1'
- '3.7.0'
- '3.8.0'
- "3.9.0"
before_install:
- pip install poetry
install:
- poetry install
- poetry install -E opencv
script:
- poetry run pytest
deploy:
  provider: script
  script: poetry publish --build -u __token__ -p $PYPI_API_KEY
  skip_existing: true
  on:
    branch: master
    tags: true
